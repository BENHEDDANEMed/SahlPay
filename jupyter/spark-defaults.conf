# --- Cluster
spark.master                         spark://spark-master:7077
spark.driver.host                    jupyter
spark.driver.bindAddress             0.0.0.0
spark.executor.memory                1g
spark.sql.session.timeZone           UTC

# --- Packages (telecharges au 1er lancement, puis gardes dans le volume ivy-cache)
#   hadoop-aws      : MinIO (s3a://)         -> Parties 1 a 6
#   spark-sql-kafka : Kafka                  -> Parties 4 et 5
#   delta-spark     : table Gold Delta Lake  -> Partie 5
#   GraphFrames (Partie 6) : a ajouter, ex. io.graphframes:graphframes-spark3_2.12:0.9.2
spark.jars.packages                  org.apache.hadoop:hadoop-aws:3.3.4,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8,io.delta:delta-spark_2.12:3.3.2

# --- Delta Lake
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog

# --- MinIO (S3A)
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin123
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider